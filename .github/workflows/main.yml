name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Begin CI...
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('.nvmrc', '.npmrc', 'package.json', 'package-lock.json') }}
      - name: Install dependencies
        run: npm ci
        env:
          CI: true

  lint:
    runs-on: ubuntu-latest
    needs: [install]

    steps:
      - name: Begin CI...
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('.nvmrc', '.npmrc', 'package.json', 'package-lock.json') }}
      - name: Build formatting plugin
        run: npm run build --workspace=@headlessui/tailwindcss
      - name: Lint
        run: npm run lint
        env:
          CI: true

  test:
    runs-on: ubuntu-latest
    needs: [install]

    steps:
      - name: Begin CI...
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('.nvmrc', '.npmrc', 'package.json', 'package-lock.json') }}
      - name: Test npm install policy
        run: npm run test:npm-policy
      - name: Test
        run: |
          npm run test || npm run test || npm run test || exit 1
        env:
          CI: true

  build:
    runs-on: ubuntu-latest
    needs: [install]

    steps:
      - name: Begin CI...
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('.nvmrc', '.npmrc', 'package.json', 'package-lock.json') }}
      - name: Build
        run: npm run build
        env:
          CI: true

  check-types:
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Begin CI...
        uses: actions/checkout@v4
      - name: Use repository Node version
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Use repository npm version
        run: npm install --global --ignore-scripts "$(node -p 'require("./package.json").packageManager')"
      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('.nvmrc', '.npmrc', 'package.json', 'package-lock.json') }}
      - name: Check Types
        run: npm run lint-types
        env:
          CI: true
